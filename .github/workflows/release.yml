name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix, for example 0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - run: make check

  release:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - run: make release
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}

  tap:
    needs: release
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: chronos-cli
          homebrew-tap: halffive/homebrew-tap
          tag-name: v${{ inputs.version }}
          commit-message: '{{formulaName}} {{version}}'
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
